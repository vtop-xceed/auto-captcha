[package]
name = "captcha-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "solver"
path = "src/solver.rs"

[dependencies]
# slim: everything this app uses (serve/Json/extract/middleware) lives in
# http1+json+tokio; the other defaults (form, http2, query, tracing…) add
# binary size with zero callers here
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "fs", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17"
zip = { version = "9", default-features = false }

# prebuilt ONNX Runtime binaries are linked statically (see deploy/Dockerfile)
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }

[profile.release]
opt-level = 3
lto = true
strip = true
