name: model-refresh
on:
  workflow_dispatch:
    inputs:
      min_accuracy:
        description: "Min decode accuracy % on training/data/test (0 = skip gate; test dir must be pushed for the gate)"
        default: "0"

permissions:
  contents: write
  packages: write
  pull-requests: write # for the chained fetch-malformed PR

# a stacked second dispatch started a second 2.5h retrain alongside the first;
# each canceled run still bills to its cancel point (≈2.5h), so keep one train
concurrency:
  group: model-refresh
  cancel-in-progress: true

jobs:
  # Preserve live captured data before anything else: fetch the malformed zip
  # and archive it via PR, then train on the already-merged labeled dataset.
  fetch-malformed:
    uses: ./.github/workflows/fetch-malformed.yml
    secrets: inherit

  train:
    # always(): a failed fetch (e.g. live-host auth hiccup) must not block
    # the retrain month
    if: ${{ always() }}
    needs: [fetch-malformed]
    runs-on: ubuntu-latest
    # training takes ~2.5h; without this a hung step bills indefinitely
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r training/train/requirements.txt

      - name: Train + export ONNX
        run: python training/train/train.py

      - name: Evaluate on test set
        id: eval
        continue-on-error: true
        run: |
          TEST_DIR="training/data/test"
          COUNT=$(find "$TEST_DIR" -maxdepth 1 \( -name '*.jpg' -o -name '*.png' \) 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            python training/train/decode_captchas.py
            LINE=$(python training/train/decode_captchas.py 2>/dev/null | grep '^Exact match:')
            ACC=$(( $(echo "$LINE" | cut -d' ' -f3 | cut -d/ -f1) * 100 / $(echo "$LINE" | cut -d/ -f2 | tr -d ' ') ))
            echo "accuracy: ${ACC}%" && echo "acc=${ACC}" >> "$GITHUB_OUTPUT"
          else
            echo "no test set in repo, skipping eval" && echo "acc=" >> "$GITHUB_OUTPUT"
          fi

      - name: Accuracy gate (optional)
        if: inputs.min_accuracy != '0' && steps.eval.outputs.acc != ''
        run: |
          ACC=${{ steps.eval.outputs.acc }}
          echo "accuracy: ${ACC}% (min required: ${{ inputs.min_accuracy }}%)"
          if [ "$ACC" -lt "${{ inputs.min_accuracy }}" ]; then
            echo "::error::accuracy ${ACC}% below minimum ${{ inputs.min_accuracy }}%"
            exit 1
          fi

      - name: Push image to GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG=$(date +%Y.%m)
          # AUTH_PASSWORD is set at runtime on the host (Render dashboard),
          # never baked into the image
          docker build -f deploy/Dockerfile . \
            -t "ghcr.io/${{ github.repository }}:${TAG}" \
            -t "ghcr.io/${{ github.repository }}:latest"
          docker push "ghcr.io/${{ github.repository }}:${TAG}"
          docker push "ghcr.io/${{ github.repository }}:latest"

      - name: Trigger Render redeploy
        # hook hiccups sleep 400s on the first cold wake; retry so a
        # successful image push never ends in a red run
        run: curl -sSf --retry 3 --retry-delay 30 -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Record deploy row in README (dataset size + accuracy graph)
        # bookkeeping only — rebase before push and never fail the run for it
        continue-on-error: true
        run: |
          COUNT=$(ls training/data/captchas 2>/dev/null | grep -ciE "\.(jpg|png)$"); COUNT=${COUNT:-0}
          ACC="${{ steps.eval.outputs.acc }}"
          python training/train/update_chart.py "$COUNT" "${ACC:--}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training/README.md
          git commit -m "chart: $(date +%F) images=$COUNT acc=$ACC%" || echo "README unchanged"
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "chart push skipped (race with newer main)"

      - uses: actions/upload-artifact@v7
        with:
          name: model-${{ github.run_id }}
          path: |
            deploy/captcha_model.onnx
            deploy/captcha_model.onnx.data
            training/train/model/captcha_model.pth
