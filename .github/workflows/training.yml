name: training

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - ".github/workflows/training.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/training.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ruff (syntax + obvious lint)
        run: pipx run ruff check training --select F,E9
      - name: compile check
        run: python -m py_compile training/train/*.py
