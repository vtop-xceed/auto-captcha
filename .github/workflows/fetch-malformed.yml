name: fetch-malformed
on:
  schedule:
    - cron: "0 4 2 * *" # 2nd of the month, 04:00 UTC
  workflow_dispatch:
  workflow_call: # chained before every model-refresh train (fetch first)

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Download malformed zip from live API
        id: fetch
        run: |
          mkdir -p /tmp/batch
          # bounded: a hung host connection would burn the job otherwise
          curl -sSf -m 60 --retry 2 --user "admin:${AUTH_PASSWORD}" "${HOST_URL%/}/malformed" -o /tmp/malformed.zip
          unzip -o -j -d /tmp/batch /tmp/malformed.zip || true # empty month passes through
          find /tmp/batch -type f ! -name '*.png' -delete
          echo "count=$(find /tmp/batch -name '*.png' | wc -l)" >> "$GITHUB_OUTPUT"
          cp /tmp/batch/*.png training/data/malformed/ 2>/dev/null || true
        env:
          HOST_URL: ${{ secrets.HOST_URL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Open PR with new captchas
        if: steps.fetch.outputs.count != '0'
        run: |
          DATE=$(date +%F)
          BRANCH="data/captchas-${DATE}-${RUN_ID}" # unique per run: cron + chained calls may share a day
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add training/data/malformed
          git commit -m "malformed: ${DATE} batch (${COUNT} images)"
          git push origin "$BRANCH"
          gh pr create \
            --title "malformed: ${DATE} batch (${COUNT} images)" \
            --body "Unlabeled malformed captchas fetched from the live API.

          Merge, then label locally: \`python training/labeler/local.py\`
          (each corrected captcha moves \`training/data/malformed\` \u2192 \`training/data/captchas\`).
          When \`malformed\` is empty: \`git add -A training/data && git commit && git push\`
          and run the \`model-refresh\` workflow."
          echo "PR URL: see actions output above"
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.fetch.outputs.count }}
