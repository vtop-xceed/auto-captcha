name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub model files (image must build; model is fetched separately)
        run: |
          mkdir -p model
          touch model/captcha_model.onnx model/captcha_model.onnx.data
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/auto-captcha-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/auto-captcha-api:latest
