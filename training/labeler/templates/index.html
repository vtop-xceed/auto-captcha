<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>captcha labeler</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .editor-row { display: flex; gap: 8px; align-items: center; justify-content: center; }
        .nav-hint { color: var(--muted); font-size: .75rem; }
        .error-line { color: #ef4444; min-height: 1.2em; font-size: .8rem; }
        .hotkey-hint kbd { border: 1px solid var(--muted); border-radius: 4px; padding: 0 6px; font-size: .7rem; }
        .pos { color: var(--muted); font-size: .8rem; }
    </style>
</head>

<body>
    <div class="container">
        <div class="progress-container">
            <div class="progress-info">
                <span class="pos"><span id="pos">-</span></span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div class="captcha-card" id="main-flow">
            <div class="captcha-image-wrapper">
                <img id="captcha-img" src="" alt="LOADING...">
            </div>
            <div class="input-group">
                <input type="text" id="label-input" placeholder="NEW LABEL (6 CHARS)" maxlength="10"
                       autocomplete="off" autofocus spellcheck="false">
            </div>
            <p class="error-line" id="error-line"></p>
            <p class="hotkey-hint nav-hint"><kbd>enter</kbd> rename or next ·
                <kbd>tab</kbd> back · <kbd>del</kbd> remove image</p>
        </div>
    </div>

    <script>
        let files = [];
        let labeled = {};   // original malformed name -> saved captchas name
        let idx = 0;

        const img = document.getElementById('captcha-img');
        const input = document.getElementById('label-input');
        const posEl = document.getElementById('pos');
        const fill = document.getElementById('progress-fill');
        const errEl = document.getElementById('error-line');

        function render() {
            if (!files.length) {
                document.getElementById('main-flow').innerHTML =
                    '<p style="text-align:center; font-size:1.2rem; color: var(--accent);">malformed empty</p>';
                posEl.textContent = '0/0'; fill.style.width = '100%'; return;
            }
            idx = Math.max(0, Math.min(idx, files.length - 1));
            const name = files[idx];
            const origExt = name.match(/\.(png|jpe?g)$/i)?.[0] || '.jpg';
            if (labeled[name]) {
                // already labeled + moved to captchas: show the final image from there
                img.src = '/labelled/' + encodeURIComponent(labeled[name]) + '?v=' + Date.now();
                input.value = labeled[name].replace(/\.(png|jpe?g)$/i, '');
            } else {
                img.src = '/captchas/' + encodeURIComponent(name) + '?v=' + Date.now();
                input.value = name.replace(/\.(png|jpe?g)$/i, '');
            }
            posEl.textContent = (idx + 1) + '/' + files.length;
            fill.style.width = ((idx + 1) / files.length * 100).toFixed(1) + '%';
            input.select();
        }

        async function refresh() {
            const r = await fetch('/api/files');
            const data = await r.json();
            files = data.files;
            labeled = data.labeled || {};
            render();
        }

        async function api(body) {
            errEl.textContent = '';
            const r = await fetch('/api/rename', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await r.json();
            if (!r.ok) { errEl.textContent = data.error || 'error'; return null; }
            return data;
        }

        async function doRename() {
            if (!files.length) return;
            const name = files[idx];
            const label = input.value.trim();
            if (label === '') { doSkip(); return; }
            const data = await api({ name, label });
            if (data) {
                const ext = name.match(/\.(png|jpe?g)$/i)?.[0] || '.jpg';
                labeled[name] = label + ext;   // stays in the window for tab-back checks
                advance(1);
            }
        }

        function doSkip() { advance(1); }
        async function doBack() { if (idx > 0) { idx -= 1; render(); } }
        async function doDelete() {
            if (!files.length) return;
            const name = files[idx];
            if (!confirm('delete ' + name + '?')) return;
            errEl.textContent = '';
            const r = await fetch('/api/delete', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (r.ok) { files.splice(idx, 1); if (idx >= files.length) idx = files.length - 1; render(); }
            else errEl.textContent = (await r.json()).error || 'error';
        }

        function advance(step) {
            if (!files.length) return;
            const next = idx + step;
            if (next < 0 || next >= files.length) { render(); return; }
            idx = next; render();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') { doBack(); e.preventDefault(); return; }
            if (e.target === input) {
                if (e.key === 'Enter') { doRename(); e.preventDefault(); }
                return;
            }
            if (e.key === 'Enter' || e.key === 'ArrowRight') advance(1);
            else if (e.key === 'ArrowLeft') doBack();
            else if (e.key === 'Delete') doDelete();
        });

        refresh();
    </script>
</body>

</html>
